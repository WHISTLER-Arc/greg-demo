name: Build and deploy

# Rebuilds the demo from Greg's main branch, so new lines, panel changes and
# images reach the demo without anyone touching this repo. Runs on every push
# here, weekly, and on demand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: WHISTLER-Arc/Greg
          path: _greg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Build
        run: python build.py --greg _greg | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html og.png icon.png .nojekyll en _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
